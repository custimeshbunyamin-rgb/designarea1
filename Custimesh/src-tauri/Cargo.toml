[package]
name = "custimesh"
version = "4.7.15"
description = "CUSTIMESH - Mesh Modülü · Revizyon 15 (3D Dental & Subperiosteal CAD Masaüstü Yazılımı)"
authors = ["Custimesh Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
